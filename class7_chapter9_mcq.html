<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class 7 Chapter 9 MCQ Test | EduPath IQ</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f7f8fb;color:#20283a}.top{background:linear-gradient(135deg,#25345f,#4d5f91);color:#fff;padding:25px 18px 32px}.wrap{width:min(960px,94%);margin:auto}.brand{font-weight:800;font-size:18px}.crumb{font-size:13px;opacity:.88;margin:7px 0 17px}.hero{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:20px}h1{margin:0;font-size:clamp(25px,5vw,38px)}.hero p{margin:8px 0 0;line-height:1.5}.panel{background:#fff;border-radius:20px;box-shadow:0 10px 30px rgba(23,32,51,.08);margin:24px auto;padding:20px}.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:700}.progress{height:9px;background:#e9eef7;border-radius:20px;overflow:hidden;margin:14px 0 22px}.bar{height:100%;width:0;background:linear-gradient(90deg,#c58b5b,#7b5ea7);transition:.25s}.qno{font-size:12px;font-weight:800;color:#7b5ea7;letter-spacing:.7px;text-transform:uppercase}.question{font-size:21px;line-height:1.45;font-weight:750;margin:8px 0 18px}.option{display:block;width:100%;text-align:left;padding:15px 16px;margin:10px 0;border:2px solid #e4e9f2;background:#fff;border-radius:14px;cursor:pointer;font-size:16px;transition:.15s}.option:hover{border-color:#8ba9df}.option.selected{border-color:#7b5ea7;background:#f5f0fa}.controls{display:flex;justify-content:space-between;gap:10px;margin-top:20px}button.ctrl{border:0;border-radius:12px;padding:12px 18px;font-weight:800;cursor:pointer}.prev{background:#eef0f5;color:#39445c}.next{background:#25345f;color:#fff}.result{display:none;text-align:center}.score{font-size:48px;font-weight:900;color:#25345f}.review{text-align:left;margin-top:20px}.review-item{padding:14px;border:1px solid #e2e7ef;border-radius:13px;margin:9px 0;background:#fbfcff}.small{font-size:13px;color:#697586;margin-top:5px}footer{text-align:center;padding:20px;color:#718096;font-size:13px}@media(max-width:600px){.panel{padding:15px}.question{font-size:18px}.option{font-size:15px;padding:13px}}
</style></head><body>
<header class="top"><div class="wrap"><div class="brand">EduPath IQ • Science MCQ Test</div><div class="crumb">Class 7 / English Medium / Chapter 9</div><div class="hero"><h1>Life Processes in Animals</h1><p>Chapter 9 • 30 Questions • Interactive Practice Test</p></div></div></header>
<main class="wrap panel" id="quiz"><div class="meta"><span id="counter"></span><span id="score"></span></div><div class="progress"><div class="bar" id="bar"></div></div><div class="qno" id="qno"></div><div class="question" id="question"></div><div id="options"></div><div class="controls"><button class="ctrl prev" id="prev" onclick="prevQ()">← Previous</button><button class="ctrl next" id="next" onclick="nextQ()">Next →</button></div></main>
<section class="wrap panel result" id="result"><div class="qno">Test Completed</div><h2>Your Result</h2><div class="score" id="final"></div><p id="message"></p><button class="ctrl next" onclick="restart()">Try Again ↻</button><div class="review" id="review"></div></section><footer>EduPath IQ • Class 7 Science • Chapter 9 MCQ</footer>
<script>
const questions=[{"q": "What is the main purpose of digestion in animals?", "o": ["To produce oxygen", "To break down complex food into simpler forms", "To remove carbon dioxide", "To pump blood"], "a": 1}, {"q": "Which type of digestion begins when teeth crush and chew food?", "o": ["Chemical digestion", "Mechanical digestion", "Cellular respiration", "Absorption"], "a": 1}, {"q": "Which substance secreted in the mouth helps break down starch into sugars?", "o": ["Bile", "Saliva", "Mucus", "Acid"], "a": 1}, {"q": "Why may chewed rice or chapati taste sweet after some time?", "o": ["The starch is broken down into simple sugars by saliva.", "The food absorbs sugar from the mouth.", "The water in the food becomes sweet.", "The teeth convert starch into sugar."], "a": 0}, {"q": "Which part carries the swallowed food from the mouth towards the stomach?", "o": ["Windpipe", "Oesophagus", "Small intestine", "Large intestine"], "a": 1}, {"q": "How does food move through the oesophagus?", "o": ["By gravity only", "By the action of the lungs", "By wave-like contraction and relaxation of its walls", "By the movement of the rib cage"], "a": 2}, {"q": "What happens to food inside the stomach?", "o": ["It is only stored and not changed.", "It is churned and mixed with digestive juice, acid and mucus.", "It is directly absorbed into the blood.", "It is converted into carbon dioxide."], "a": 1}, {"q": "Which substance protects the stomach lining from the acid present in it?", "o": ["Saliva", "Mucus", "Bile", "Pancreatic juice"], "a": 1}, {"q": "What is one important function of the acid present in the stomach?", "o": ["It helps break down proteins and kills many harmful bacteria.", "It absorbs most nutrients.", "It helps the lungs exchange gases.", "It changes fats directly into oxygen."], "a": 0}, {"q": "Which organ secretes bile?", "o": ["Stomach", "Liver", "Pancreas", "Small intestine"], "a": 1}, {"q": "How does bile help in digestion?", "o": ["It breaks starch into sugar.", "It neutralises acid and breaks fats into tiny droplets.", "It absorbs water from food.", "It carries oxygen to the body."], "a": 1}, {"q": "Which organ secretes pancreatic juice?", "o": ["Liver", "Stomach", "Pancreas", "Large intestine"], "a": 2}, {"q": "Most of the digested food in human beings is absorbed through the walls of the:", "o": ["Stomach", "Small intestine", "Large intestine", "Pancreas"], "a": 1}, {"q": "Why is the inner lining of the small intestine specially suited for absorption?", "o": ["It contains many finger-like projections that increase the surface area.", "It contains teeth for chewing food.", "It has a thick layer of acid.", "It stores food for a long time."], "a": 0}, {"q": "What happens to the nutrients absorbed from the small intestine?", "o": ["They are removed from the body.", "They are carried by blood to different parts of the body.", "They are changed into undigested food.", "They are sent directly to the lungs."], "a": 1}, {"q": "Which part mainly absorbs the remaining water and some salts from undigested food?", "o": ["Stomach", "Small intestine", "Large intestine", "Oesophagus"], "a": 2}, {"q": "What is the semi-solid waste formed in the large intestine called?", "o": ["Bile", "Stool", "Saliva", "Glucose"], "a": 1}, {"q": "The removal of undigested food from the body through the anus is called:", "o": ["Absorption", "Digestion", "Egestion", "Respiration"], "a": 2}, {"q": "Why do cows chew their food again after swallowing it?", "o": ["They do not have a stomach.", "Their partially digested food is brought back to the mouth for thorough chewing.", "They cannot swallow food properly.", "Their food is completely undigested in the mouth."], "a": 1}, {"q": "What is the process of bringing partially digested food back to the mouth and chewing it again called?", "o": ["Absorption", "Rumination", "Egestion", "Respiration"], "a": 1}, {"q": "Birds do not have teeth. Which structure helps them break down food mechanically?", "o": ["Rumen", "Gizzard", "Alveoli", "Diaphragm"], "a": 1}, {"q": "Which of the following is needed to break down glucose and release energy during respiration?", "o": ["Carbon dioxide", "Oxygen", "Water", "Sunlight"], "a": 1}, {"q": "Which statement correctly describes breathing?", "o": ["It is the process of breaking down glucose.", "It is the process of inhaling and exhaling air.", "It is the absorption of nutrients.", "It is the removal of undigested food."], "a": 1}, {"q": "Which structures in the lungs are mainly responsible for the exchange of oxygen and carbon dioxide?", "o": ["Nostrils", "Windpipe", "Alveoli", "Rib cage"], "a": 2}, {"q": "During inhalation, what happens to the diaphragm?", "o": ["It moves upwards.", "It moves downwards.", "It remains unchanged.", "It moves towards the lungs."], "a": 1}, {"q": "Why does air enter the lungs when the diaphragm moves downwards?", "o": ["The space inside the chest increases.", "The lungs become smaller.", "The ribs move inward.", "Carbon dioxide enters the lungs."], "a": 0}, {"q": "Which statement correctly describes the air we exhale?", "o": ["It contains more oxygen than inhaled air.", "It contains more carbon dioxide than inhaled air.", "It contains no carbon dioxide.", "It contains only carbon dioxide."], "a": 1}, {"q": "A student blows exhaled air into lime water and it turns milky. What does this observation indicate?", "o": ["Exhaled air contains carbon dioxide.", "Exhaled air contains no oxygen.", "Lime water reacts with nitrogen.", "Exhaled air contains more water than inhaled air."], "a": 0}, {"q": "Which statement correctly explains the difference between breathing and respiration?", "o": ["Breathing is a chemical process, while respiration is a physical process.", "Both are exactly the same process.", "Breathing is a physical process, while respiration is a chemical process that releases usable energy.", "Respiration takes place only in the lungs."], "a": 2}, {"q": "Which of the following correctly matches the structure with its function?", "o": ["Alveoli — exchange of gases", "Small intestine — pumping of blood", "Oesophagus — absorption of oxygen", "Gizzard — exchange of gases"], "a": 0}];let current=0,answers=Array(questions.length).fill(null);
function scoreNow(){return answers.reduce((n,a,i)=>n+(a===questions[i].a?1:0),0)}
function render(){let x=questions[current];document.getElementById('counter').textContent=`Question ${current+1} of ${questions.length}`;document.getElementById('score').textContent=`Score: ${scoreNow()}`;document.getElementById('bar').style.width=`${(current+1)/questions.length*100}%`;document.getElementById('qno').textContent=`Question ${current+1}`;document.getElementById('question').textContent=x.q;let box=document.getElementById('options');box.innerHTML='';x.o.forEach((o,i)=>{let b=document.createElement('button');b.className='option'+(answers[current]===i?' selected':'');b.textContent=`${['A','B','C','D'][i]}) ${o}`;b.onclick=()=>{answers[current]=i;render()};box.appendChild(b)});document.getElementById('prev').disabled=current===0;document.getElementById('next').textContent=current===questions.length-1?'Finish Test ✓':'Next →'}
function nextQ(){if(current<questions.length-1){current++;render()}else finish()}function prevQ(){if(current>0){current--;render()}}
function finish(){let u=answers.filter(x=>x===null).length;if(u&&!confirm(u+' question(s) are unanswered. Finish the test anyway?'))return;document.getElementById('quiz').style.display='none';document.getElementById('result').style.display='block';let s=scoreNow();document.getElementById('final').textContent=`${s} / ${questions.length}`;document.getElementById('message').textContent=s>=24?'Excellent work!':s>=18?'Good job! Keep practising.':'Keep practising and review the chapter once more.';let r=document.getElementById('review');r.innerHTML='<h3>Answer Review</h3>';questions.forEach((x,i)=>{let y=answers[i]===null?'Not answered':`${['A','B','C','D'][answers[i]]}) ${x.o[answers[i]]}`;let c=`${['A','B','C','D'][x.a]}) ${x.o[x.a]}`;let d=document.createElement('div');d.className='review-item';d.innerHTML=`<strong>Q${i+1}. ${x.q}</strong><div class="small">Your answer: ${y}</div><div class="small">Correct answer: ${c}</div>`;r.appendChild(d)});window.scrollTo(0,0)}
function restart(){current=0;answers=Array(questions.length).fill(null);document.getElementById('result').style.display='none';document.getElementById('quiz').style.display='block';render()}render();
</script></body></html>
