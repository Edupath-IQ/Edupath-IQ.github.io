<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EduPath IQ | Class 7 Science Chapter 8 Live Test</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#fff4d6 0%,#e9f7ff 38%,#f7eaff 72%,#eafff5 100%);color:#172033}
.wrap{max-width:900px;margin:auto;padding:18px} .hero{background:linear-gradient(135deg,#ffffff,#fff7fb);border-radius:24px;padding:22px;box-shadow:0 10px 30px #0002;text-align:center;border:3px solid #d9c7ff}
h1{margin:0;background:linear-gradient(90deg,#7b2cbf,#e83e8c,#0ea5a4);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:29px} .sub{color:#475569;margin:8px 0 16px}
.info{display:grid;grid-template-columns:repeat(4,1fr);gap:8px} .pill{padding:10px;border-radius:14px;font-weight:700} .p1{background:#ffe08a}.p2{background:#bde0fe}.p3{background:#cdeccf}.p4{background:#f7c6e7}
.timer{position:sticky;top:10px;z-index:5;margin:14px 0;background:linear-gradient(90deg,#172033,#40366e);color:white;border-radius:18px;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 8px 22px #0003;border:2px solid #756cf2}
#time{font-size:24px;font-weight:800;color:#ffe08a;text-shadow:0 0 10px #ffe08a66} button{border:0;border-radius:14px;padding:12px 18px;font-weight:800;cursor:pointer} #submit{background:#7b2cbf;color:white} .q{margin:14px 0;background:linear-gradient(135deg,#ffffff,#fffaff);border-radius:18px;padding:16px;border-left:8px solid var(--c);box-shadow:0 6px 20px #00000014;border-top:2px solid #ffffff} .q h3{margin:0 0 12px;font-size:17px} label{display:block;padding:11px 12px;margin:7px 0;background:linear-gradient(90deg,#f8fafc,#ffffff);border:2px solid #e2e8f0;border-radius:12px;cursor:pointer;transition:.15s} label:hover{background:#fff0f8;border-color:#c084fc;transform:translateX(2px)} input{margin-right:9px} .result{display:none;background:white;border-radius:22px;padding:22px;margin-top:18px;box-shadow:0 10px 30px #0002} .score{font-size:34px;font-weight:900;color:#7b2cbf} .review{margin-top:16px} .correct{background:#ecfdf5;border-left:6px solid #16a34a;padding:10px;border-radius:10px;margin:8px 0} .wrong{background:#fff1f2;border-left:6px solid #e11d48;padding:10px;border-radius:10px;margin:8px 0} .ex{color:#334155;margin-top:4px} @media(max-width:600px){.info{grid-template-columns:repeat(2,1fr)}h1{font-size:23px}.wrap{padding:10px}}

.q:nth-child(4n+1){background:linear-gradient(135deg,#fffdf5,#fff1f6)}
.q:nth-child(4n+2){background:linear-gradient(135deg,#f4fbff,#eef7ff)}
.q:nth-child(4n+3){background:linear-gradient(135deg,#faf7ff,#f2edff)}
.q:nth-child(4n){background:linear-gradient(135deg,#f4fff9,#ecfff5)}
</style>
</head>
<body>
<div class="wrap">
<div class="hero">
<h1>🎯 Class 7 Science — Chapter 8</h1>
<div class="sub">Measurement of Time and Motion</div>
<div class="info"><div class="pill p1">30 MCQs</div><div class="pill p2">15 Minutes</div><div class="pill p3">30 Marks</div><div class="pill p4">1 Mark Each</div></div>
</div>
<div class="timer"><span>⏱️ Time Remaining</span><span id="time">15:00</span></div>
<form id="quiz"></form>
<button id="submit" type="button">Submit Test & See Result</button>
<div id="result" class="result"></div>
</div>
<script>
const questions = [{"q":"A sundial tells time mainly by observing the change in the position of a:","options":["shadow","water level","sand level","pendulum"],"answer":"A","explanation":"The shadow changes position as the Sun appears to move across the sky."},{"q":"In an hourglass, time is measured using the:","options":["flow of sand","colour of sand","mass of sand","temperature of sand"],"answer":"A","explanation":"A nearly regular flow of sand can be used to measure time."},{"q":"Why is coloured ink used in a water clock?","options":["To make the water level easier to observe","To increase the speed of water","To make water heavier","To stop evaporation"],"answer":"A","explanation":"Colour makes the changing water level easier to observe."},{"q":"If a water clock has marks at one-minute intervals, the fourth mark represents:","options":["1 minute","2 minutes","3 minutes","4 minutes"],"answer":"D","explanation":"The fourth one-minute interval corresponds to 4 minutes."},{"q":"A process that repeats itself at nearly equal time intervals is called:","options":["periodic motion/process","random motion","rest","non-uniform motion"],"answer":"A","explanation":"Regularly repeating processes are useful for measuring time."},{"q":"A pendulum moves from O to A, then B and back to O. This is:","options":["half an oscillation","one complete oscillation","two oscillations","three oscillations"],"answer":"B","explanation":"One complete to-and-fro motion about the mean position is one oscillation."},{"q":"A pendulum completes 10 oscillations in 18 s. Its time period is:","options":["0.18 s","1.8 s","18 s","180 s"],"answer":"B","explanation":"Time period = total time ÷ number of oscillations = 18 ÷ 10 = 1.8 s."},{"q":"Two pendulums have the same length but different masses. Their time periods will be:","options":["nearly the same","always different","zero","dependent only on mass"],"answer":"A","explanation":"For the same length, changing the mass does not significantly change the time period."},{"q":"If the length of a pendulum is changed, which quantity changes?","options":["time period","SI unit of time","mass of bob only","number of seconds in a minute"],"answer":"A","explanation":"The time period of a pendulum depends on its length."},{"q":"Equal oscillations completed in nearly equal times indicate that the pendulum has:","options":["a nearly constant time period","no motion","increasing mass","random motion"],"answer":"A","explanation":"Nearly equal times for equal oscillations indicate a regular time period."},{"q":"The SI unit of time is represented by:","options":["m","s","h","min"],"answer":"B","explanation":"The SI unit of time is second, symbol s."},{"q":"60 seconds are equal to:","options":["1 minute","10 minutes","1 hour","30 minutes"],"answer":"A","explanation":"1 minute = 60 seconds."},{"q":"A car travels 300 m in 30 s. Its speed is:","options":["5 m/s","10 m/s","30 m/s","90 m/s"],"answer":"B","explanation":"Speed = distance ÷ time = 300 ÷ 30 = 10 m/s."},{"q":"A cyclist covers 3.6 km in 15 minutes. Its speed is:","options":["2 m/s","4 m/s","6 m/s","15 m/s"],"answer":"B","explanation":"3.6 km = 3600 m and 15 min = 900 s, so speed = 4 m/s."},{"q":"Two students cover the same distance. The one taking less time is:","options":["moving faster","moving slower","at rest","necessarily moving uniformly"],"answer":"A","explanation":"For the same distance, less time means greater speed."},{"q":"A vehicle travels at 50 km/h for 2 h. The distance covered is:","options":["25 km","50 km","100 km","150 km"],"answer":"C","explanation":"Distance = speed × time = 50 × 2 = 100 km."},{"q":"A train covers 360 km at 90 km/h. The time taken is:","options":["2 h","3 h","4 h","5 h"],"answer":"C","explanation":"Time = distance ÷ speed = 360 ÷ 90 = 4 h."},{"q":"A train moves at 18 m/s and another at 72 km/h. Which statement is correct?","options":["First is faster by 2 m/s","Second is faster by 2 m/s","Both have the same speed","First is faster by 4 m/s"],"answer":"B","explanation":"72 km/h = 20 m/s, so the second train is faster by 2 m/s."},{"q":"If a body covers unequal distances in equal intervals of time, its motion is:","options":["uniform","non-uniform","at rest","periodic only"],"answer":"B","explanation":"Unequal distances in equal time intervals indicate non-uniform motion."},{"q":"A cyclist covers 20 km in every 10-minute interval. The motion is:","options":["uniform","non-uniform","random","at rest"],"answer":"A","explanation":"Equal distances in equal time intervals indicate uniform motion."},{"q":"A runner covers 20, 15, 15, 25, 20 and 25 km in equal time intervals. The motion is:","options":["uniform","non-uniform","periodic","at rest"],"answer":"B","explanation":"The distances covered in equal time intervals are unequal."},{"q":"A body travels 150 m in 10 s. Its speed in km/h is:","options":["15 km/h","36 km/h","54 km/h","60 km/h"],"answer":"C","explanation":"Speed = 15 m/s = 15 × 3.6 = 54 km/h."},{"q":"A body moving along a straight path can still have:","options":["non-uniform motion","only uniform motion","only periodic motion","no motion"],"answer":"A","explanation":"Straight-line motion describes the path; speed may still change."},{"q":"A body moving in a straight line with constant speed has:","options":["uniform linear motion","non-uniform motion","random motion","oscillatory motion"],"answer":"A","explanation":"Constant speed along a straight path is uniform linear motion."},{"q":"Which instrument in a vehicle directly shows its speed?","options":["odometer","speedometer","clock","thermometer"],"answer":"B","explanation":"A speedometer indicates speed."},{"q":"A vehicle travels 500 m at 10 m/s and another 500 m at 5 m/s. Total time taken is:","options":["50 s","100 s","150 s","200 s"],"answer":"C","explanation":"Times are 50 s and 100 s, so total time is 150 s."},{"q":"A 2 km journey takes 200 s. If the first 1 km takes 150 s, the remaining 1 km takes:","options":["25 s","50 s","100 s","150 s"],"answer":"B","explanation":"Remaining time = 200 − 150 = 50 s."},{"q":"Two observations of a moving body at different times are not enough to establish uniform motion because:","options":["distance covered during equal intervals is not known","time cannot be measured","the body must be at rest","speed is always zero"],"answer":"A","explanation":"Uniform motion is judged by comparing distances covered in equal time intervals."},{"q":"Average speed is calculated using:","options":["total distance ÷ total time","total time ÷ total distance","distance × time","speed ÷ time"],"answer":"A","explanation":"Average speed = total distance travelled ÷ total time taken."},{"q":"To compare how fast two bodies move over different distances, we should compare their:","options":["distance covered per unit time","total distance only","total time only","mass"],"answer":"A","explanation":"Speed gives the distance covered per unit time."}]
const letters=["A","B","C","D"];
const colors=["#f59e0b","#3b82f6","#8b5cf6","#22c55e","#ec4899","#06b6d4","#f97316","#14b8a6"];
const quiz=document.getElementById("quiz");
questions.forEach((x,i)=>{
 const box=document.createElement("div"); box.className="q"; box.style.setProperty("--c",colors[i%colors.length]);
 box.innerHTML=`<h3>Q${i+1}. ${x.q}</h3>`+x.options.map((o,j)=>`<label><input type="radio" name="q${i}" value="${letters[j]}"> <b>${letters[j]}.</b> ${o}</label>`).join("");
 quiz.appendChild(box);
});
let seconds=15*60, submitted=false;
const timeEl=document.getElementById("time");
function tick(){
 if(submitted)return;
 const m=Math.floor(seconds/60),s=seconds%60;
 timeEl.textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
 if(seconds<=0){submitTest(true);return;}
 seconds--;
}
setInterval(tick,1000); tick();

document.getElementById("submit").addEventListener("click",()=>submitTest(false));
function submitTest(auto){
 if(submitted)return; submitted=true;
 let score=0, review="";
 questions.forEach((x,i)=>{
   const chosen=document.querySelector(`input[name="q${i}"]:checked`);
   const got=chosen?chosen.value:"Not answered";
   const ok=got===x.answer; if(ok)score++;
   review+=`<div class="${ok?"correct":"wrong"}"><b>Q${i+1} — ${ok?"Correct":"Review"}</b><br>
   Your answer: ${got}<br>Correct answer: <b>${x.answer}</b>
   <div class="ex"><b>Explanation:</b> ${x.explanation}</div></div>`;
 });
 const pct=Math.round(score/30*100);
 document.getElementById("result").style.display="block";
 document.getElementById("result").innerHTML=`<div>🏆 Test ${auto?"submitted automatically because the 15-minute timer ended.":"submitted successfully."}</div>
 <div class="score">${score} / 30</div><div><b>Percentage: ${pct}%</b></div><div class="review"><h2>📘 Answer Review</h2>${review}</div>`;
 document.getElementById("submit").disabled=true;
 document.getElementById("submit").textContent="Test Submitted";
 window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
}
</script>
</body></html>
