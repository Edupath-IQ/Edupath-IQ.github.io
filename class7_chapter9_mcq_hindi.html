<script>

र"], "a": 1}, {"q": "पित्त पाचन में किस प्रकार सहायता करता है?", "o": ["यह मण्ड को शर्करा में बदलता है।", "यह अम्ल को उदासीन करता है और वसा को छोटी-छोटी बूंदों में तोड़ने में सहायता करता है।", "यह भोजन से जल का अवशोषण करता है।", "यह शरीर में ऑक्सीजन पहुँचाता है।"], "a": 1}, {"q": "अग्न्याशयी रस किस अंग द्वारा स्रावित किया जाता है?", "o": ["यकृत", "आमाशय", "अग्न्याशय", "बृहदांत्र"], "a": 2}, {"q": "मनुष्य में पचे हुए भोजन का अधिकांश भाग किसकी भित्तियों द्वारा अवशोषित किया जाता है?", "o": ["आमाशय", "क्षुद्रांत्र", "बृहदांत्र", "अग्न्याशय"], "a": 1}, {"q": "क्षुद्रांत्र की आंतरिक सतह अवशोषण के लिए किस प्रकार विशेष रूप से अनुकूलित होती है?", "o": ["इसमें अनेक अंगुली के समान उंगलीनुमा प्रवर्ध होते हैं, जो अवशोषण के लिए सतह क्षेत्र बढ़ाते हैं।", "इसमें भोजन चबाने के लिए दाँत होते हैं।", "इसमें अम्ल की मोटी परत होती है।", "इसमें भोजन लंबे समय तक संग्रहित रहता है।"], "a": 0}, {"q": "क्षुद्रांत्र से अवशोषित पोषक पदार्थों का क्या होता है?", "o": ["वे शरीर से बाहर निकाल दिए जाते हैं।", "वे रुधिर द्वारा शरीर के विभिन्न भागों तक पहुँचाए जाते हैं।", "वे अपचित भोजन में बदल जाते हैं।", "वे सीधे फेफड़ों तक पहुँचते हैं।"], "a": 1}, {"q": "अपचित भोजन से बचे अधिकतर जल और कुछ लवणों का अवशोषण मुख्य रूप से किस भाग में होता है?", "o": ["आमाशय", "क्षुद्रांत्र", "बृहदांत्र", "ग्रासनली"], "a": 2}, {"q": "बृहदांत्र में बनने वाला अर्ध-ठोस अपशिष्ट क्या कहलाता है?", "o": ["पित्त", "मल", "लार", "ग्लूकोस"], "a": 1}, {"q": "अपचित भोजन को गुदा द्वारा शरीर से बाहर निकालने की प्रक्रिया कहलाती है—", "o": ["अवशोषण", "पाचन", "उत्सर्जन", "उच्छ्वसन"], "a": 2}, {"q": "गाय जैसे जंतु अपना भोजन दोबारा क्यों चबाते हैं?", "o": ["उनके पास आमाशय नहीं होता।", "वे आंशिक रूप से पचे भोजन को वापस मुख में लाकर अच्छी तरह चबाते हैं।", "वे भोजन निगल नहीं सकते।", "उनके मुख में भोजन का पाचन नहीं होता।"], "a": 1}, {"q": "आंशिक रूप से पचे भोजन को वापस मुख में लाकर दोबारा चबाने की प्रक्रिया क्या कहलाती है?", "o": ["अवशोषण", "रोमंथन", "उत्सर्जन", "श्वसन"], "a": 1}, {"q": "पक्षियों में दाँत नहीं होते। भोजन को यांत्रिक रूप से तोड़न let current=0, answers=Array(questions.length).fill(null);
const qEl=document.getElementById('question'),oEl=document.getElementById('options'),countEl=document.getElementById('count'),ansEl=document.getElementById('answered'),fillEl=document.getElementById('fill');
function render(){
 const item=questions[current]; countEl.textContent=`प्रश्न ${current+1} / ${questions.length}`; ansEl.textContent=`उत्तर: ${answers.filter(x=>x!==null).length}`; fillEl.style.width=`${((current+1)/questions.length)*100}%`;
 qEl.textContent=`${current+1}. ${item.q}`; oEl.innerHTML='';
 item.o.forEach((opt,i)=>{const b=document.createElement('button');b.className='option'+(answers[current]===i?' selected':'');b.innerHTML=`<span class="letter">${String.fromCharCode(65+i)}</span><span>${opt}</span>`;b.onclick=()=>{answers[current]=i;render()};oEl.appendChild(b)});
 document.getElementById('prev').disabled=current===0;document.getElementById('next').style.display=current===questions.length-1?'none':'inline-block';document.getElementById('submit').style.display=current===questions.length-1?'inline-block':'none';
}
document.getElementById('prev').onclick=()=>{if(current>0){current--;render()}};document.getElementById('next').onclick=()=>{if(current<questions.length-1){current++;render()}};
let timeLeft=15*60, timerId=null, submitted=false;
function updateTimer(){
 const el=document.getElementById('timer');
 const m=Math.floor(timeLeft/60), sec=timeLeft%60;
 el.textContent=`⏱️ ${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
 el.classList.toggle('warning',timeLeft<=60);
}
function finishTest(auto=false){
 if(!auto && answers.includes(null)){alert('कृपया सभी 30 प्रश्नों के उत्तर चुनें।');return false}
 clearInterval(timerId); timerId=null; submitted=true;
 let score=0; answers.forEach((a,i)=>{if(a===questions[i].a)score++});
 document.getElementById('testBox').style.display='none';
 document.getElementById('result').style.display='block';
 document.getElementById('score').textContent=`${score} / ${questions.length}`;
 document.getElementById('message').textContent=auto?'समय समाप्त हो गया। आपका टेस्ट स्वतः जमा कर दिया गया।':score>=27?'शानदार! आपकी तैयारी बहुत अच्छी है।':score>=21?'बहुत बढ़िया! थोड़ी और practice करें।':score>=15?'अच्छा प्रयास! अध्याय को एक बार फिर revise करें।':'कोई बात नहीं! अध्याय को दोबारा पढ़कर फिर प्रयास करें।';
 document.getElementById('review').innerHTML='<h3>उत्तर समीक्षा</h3>'+questions.map((x,i)=>`<div class="review-item"><b>${i+1}. ${x.q}</b><br>आपका उत्तर: ${answers[i]===null?'उत्तर नहीं दिया':String.fromCharCode(65+answers[i])+') '+x.o[answers[i]]}<br>सही उत्तर: ${String.fromCharCode(65+x.a)}) ${x.o[x.a]}</div>`).join('');
 return true;
}
document.getElementById('submit').onclick=()=>finishTest(false);
document.getElementById('restart').onclick=()=>{
 clearInterval(timerId); current=0; answers=Array(questions.length).fill(null); submitted=false; timeLeft=15*60;
 document.getElementById('result').style.display='none'; document.getElementById('testBox').style.display='block';
 updateTimer(); render();
 timerId=setInterval(()=>{
   if(submitted){clearInterval(timerId);return}
   timeLeft--; updateTimer();
   if(timeLeft<=0){clearInterval(timerId);timerId=null;finishTest(true)}
 },1000);
};
updateTimer(); render();
timerId=setInterval(()=>{
 if(submitted){clearInterval(timerId);return}
 timeLeft--; updateTimer();
 if(timeLeft<=0){clearInterval(timerId);timerId=null;finishTest(true)}
},1000);
</script>
